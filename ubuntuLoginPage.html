<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A clearly labeled, Ubuntu-inspired sign-in screen demo."
    />
    <title>Ubuntu-inspired sign-in demo</title>
    <link rel="stylesheet" href="css/UbuntuLoginPage.css" />
    <script src="js/UbuntuLoginPage.js" defer></script>
  </head>
  <body class="lock-screen">
    <main class="screen">
      <header class="top-bar">
        <span class="demo-label"></span>
        <div class="status-area">
          <div class="status-icons" role="group" aria-label="Demo system status">
            <img src="css/icons/nm-signal-75.svg" alt="Network" />
            <img src="css/icons/bluetooth-active.svg" alt="Bluetooth" />
            <img src="css/icons/audio-volume-high-panel.svg" alt="Sound" />
            <img src="css/icons/system-shutdown-panel.svg" alt="Power" />
          </div>
          <time id="top-time" aria-label="Current time"></time>
        </div>
      </header>

      <section class="lock-content" aria-label="Lock screen clock">
        <div>
          <h1 class="clock" id="clock" aria-label="Current time"></h1>
          <p class="date" id="date"></p>
        </div>
      </section>
      <a
        class="screen-continue"
        href="UbuntuLoginCredentials.html"
        aria-label="Continue to the Ubuntu-inspired demo sign-in screen"
      ></a>
    </main>
  </body>
</html>
