<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A no-password Ubuntu-inspired sign-in and desktop demo."
    />
    <title>Ubuntu-inspired sign-in demo</title>
    <link rel="stylesheet" href="css/UbuntuLoginPage.css" />
    <link rel="stylesheet" href="css/UbuntuLoginCredentials.css" />
    <script src="js/UbuntuLoginPage.js" defer></script>
  </head>
  <body class="profile-screen credential-screen">
    <main class="screen">
      <header class="top-bar">
        <span class="demo-label">UI DEMO · NOT A SYSTEM LOGIN</span>
        <time id="top-time" aria-label="Current time"></time>
        <div class="status-area">
          <div class="status-icons" role="group" aria-label="Demo system status">
            <img src="css/icons/nm-signal-75.svg" alt="Network" />
            <img src="css/icons/bluetooth-active.svg" alt="Bluetooth" />
            <img src="css/icons/audio-volume-high-panel.svg" alt="Sound" />
            <img src="css/icons/system-shutdown-panel.svg" alt="Power" />
          </div>
        </div>
      </header>

      <section class="profile-content credential-content" id="profile-view" aria-label="Choose a demo user">
        <button class="user-tile" id="select-demo-user" type="button" aria-expanded="false" aria-controls="password-view">
          <span class="avatar" aria-hidden="true">D</span>
          <span>Demo User</span>
        </button>
        <p class="not-listed">Not listed?</p>
      </section>

      <section class="password-view" id="password-view" aria-labelledby="password-title" hidden>
        <h1 id="password-title" tabindex="-1">Demo User</h1>
        <div class="password-preview" aria-label="Decorative, non-interactive password field preview">
          <span aria-hidden="true">••••••••</span>
          <span class="preview-tag">DEMO ONLY</span>
        </div>
        <p class="privacy-note">
          This display is not an input. No password is requested or collected.
        </p>
        <button class="primary-button" id="open-demo" type="button">
          Open demo desktop
        </button>
      </section>

      <section
        class="desktop-view"
        id="desktop-view"
        aria-labelledby="desktop-title"
        hidden
      >
        <div class="desktop-card">
          <div class="desktop-mark" aria-hidden="true">●</div>
          <p class="eyebrow">DEMO SESSION</p>
          <h1 id="desktop-title" tabindex="-1">You’re in the demo</h1>
          <p>
            This sample desktop is only a visual preview. It did not sign in to
            a computer or use an account.
          </p>
          <button class="secondary-button" id="return-to-profile" type="button">
            Back to profile
          </button>
        </div>
      </section>

      <footer class="bottom-bar">
        <span class="wordmark" aria-label="Ubuntu-inspired demo">ubuntu<span class="wordmark-mark" aria-hidden="true"></span></span>
      </footer>
    </main>
  </body>
</html>
